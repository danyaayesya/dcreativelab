
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090D16">
<title>DCreativelab Studio</title>
<style>
:root {
  --bg: #090D16;
  --panel: #111927;
  --panel2: #151F30;
  --border: #29374B;
  --text: #F2F5FA;
  --muted: #8999AF;
  --accent: #69E7D4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 0%,
      #173E4840, transparent 48%),
    radial-gradient(ellipse at 100% 60%,
      #34305B18, transparent 38%);
}
.container {
  width: min(1080px, calc(100% - 36px));
  margin: auto;
}
header {
  text-align: center;
  padding: 42px 0 30px;
}
.logo {
  display: block;
  width: 116px;
  max-width: 36%;
  max-height: 90px;
  height: auto;
  object-fit: contain;
  margin: 0 auto 18px;
}
.brand {
  margin: 0;
  font-size: clamp(25px, 4vw, 34px);
  letter-spacing: -1px;
  font-weight: 750;
}
.brand span { color: var(--accent); }
.tagline {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: .5px;
}
.hero {
  text-align: center;
  padding: 18px 0 32px;
}
.eyebrow {
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
}
.hero h2 {
  font-size: clamp(25px, 4vw, 40px);
  letter-spacing: -1.3px;
  margin: 15px 0 8px;
}
.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}
.search {
  min-width: 0;
  flex: 1;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 13px;
  outline: none;
}
.search:focus { border-color: var(--accent); }
.count {
  display: flex;
  align-items: center;
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 18px;
  scrollbar-width: thin;
}
.filter {
  border: 1px solid var(--border);
  color: #B7C4D5;
  background: transparent;
  border-radius: 30px;
  padding: 9px 15px;
  font-size: 12px;
  white-space: nowrap;
  cursor: pointer;
  transition: .2s;
}
.filter:hover, .filter.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #071512;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.item {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 150px;
  padding: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: linear-gradient(145deg,
    #141E2D, #0E1521);
  text-decoration: none;
  color: var(--text);
  transition: transform .22s, border-color .22s,
              box-shadow .22s;
}
.item::after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  right: -55px;
  top: -55px;
  border-radius: 50%;
  background: #69E7D410;
  transition: .22s;
}
.item:hover {
  transform: translateY(-3px);
  border-color: #69E7D4A0;
  box-shadow: 0 8px 28px #00000035,
              0 0 18px #69E7D410;
}
.item:hover::after { background: #69E7D425; }
.item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.symbol {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #69E7D415;
  border: 1px solid #69E7D425;
  color: var(--accent);
  font-size: 14px;
  font-weight: 750;
}
.arrow { color: #8293AA; font-size: 18px; }
.item h3 {
  font-size: 15px;
  font-weight: 650;
  line-height: 1.4;
  margin: 18px 0 8px;
  overflow-wrap: anywhere;
}
.category {
  margin-top: auto;
  padding-top: 5px;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.empty {
  display: none;
  text-align: center;
  padding: 40px 10px;
  color: var(--muted);
  font-size: 13px;
}
footer {
  text-align: center;
  padding: 40px 0 24px;
  font-size: 11px;
  color: #68788D;
  letter-spacing: .5px;
}
footer span { color: var(--accent); }
@media (max-width: 680px) {
  .container { width: calc(100% - 28px); }
  header { padding-top: 32px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .item { padding: 15px; min-height: 138px; }
  .item h3 { font-size: 13px; margin-top: 14px; }
  .toolbar { gap: 8px; }
}
@media (max-width: 360px) {
  .grid { gap: 8px; }
  .item { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

  
.product-image {
  display: block;
  width: 100%;
  height: 150px;
  padding: 10px;
  margin: 0 0 14px;
  object-fit: contain;
  object-position: center;
  border-radius: 12px;
  background: #0B1220;
  border: 1px solid #29374B;
}

.image-error {
  color: #FF9A9A;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 680px) {
  .product-image {
    height: 120px;
    padding: 8px;
  }
}

  
</style>
</head>
<body>
<div class="container">

  <header>
    <img src="images/logo.png" class="logo"
         alt="DCreativelab Studio"
         onerror="this.hidden=true">
    <h1 class="brand">DCreativelab <span>Studio</span></h1>
    <p class="tagline">Connecting Creativity &amp; Education</p>
  </header>

  <section class="hero">
    <div class="eyebrow">YOUR DIGITAL DISCOVERY SPACE</div>
  </section>

  <main>
    <div class="toolbar">
      <input id="search" class="search" type="search"
        placeholder="Search collection..."
        aria-label="Search collection">
      <div class="count" id="count"></div>
    </div>

    <nav class="filters" id="filters"
         aria-label="Filter categories"></nav>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">
      Nothing found. Try another search.
    </div>
  </main>

  <footer>
    <span>DCREATIVELAB STUDIO</span>
    <br>© 2026   </footer>
</div>

const links = [
  {
    name: "Nota Kafa Jakim",
    category: "Education",
    url: "https://pesanabi.com/order/form/NotaKafa/1281",
    image: "images/notakafa.png"
  },
  {
    name: "PROMOSI 50% DISKAUN! Video Silibus KAFA JAKIM",
    category: "Education",
    url: "https://pesanabi.com/order/form/VideoKafaByTahun/1281",
    image: "videokafa.png"
  },
  {
    name: "100 Video Kuiz Pengetahuan Am Untuk Anak-Anak 6-15 Tahun",
    category: "Education",
    url: "https://pesanabi.com/order/form/kuiz_anakbijak/1281",
    image: "images/vidpa.png"
  }
];


const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
let active = "All";

const categories = ["All", ...new Set(links.map(x => x.category))];

categories.forEach(category => {
  const button = document.createElement("button");
  button.className = "filter" +
    (category === active ? " active" : "");
  button.textContent = category;
  button.type = "button";
  button.onclick = () => {
    active = category;
    filters.querySelectorAll("button").forEach(b =>
      b.classList.toggle("active", b.textContent === active)
    );
    render();
  };
  filters.appendChild(button);
});

function render() {
  const query = search.value.trim().toLowerCase();

  const results = links.filter(link =>
    (active === "All" || link.category === active) &&
    (link.name + " " + link.category)
      .toLowerCase().includes(query)
  );

  grid.replaceChildren();

  results.forEach(link => {
    const card = document.createElement("a");
    card.className = "item";
    card.href = link.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    // IMAGE PRODUK
    const image = document.createElement("img");
    image.className = "product-image";
    image.alt = link.name;
    image.src = link.image || "";
    image.loading = "lazy";

    // Jika gambar gagal dimuatkan, tunjukkan sebab
    image.onerror = function () {
      this.removeAttribute("src");
      this.alt = "Gambar tidak dijumpai: " + link.name;
      this.classList.add("image-error");
    };

    // Bahagian atas panel
    const top = document.createElement("div");
    top.className = "item-top";

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "↗";
    arrow.setAttribute("aria-hidden", "true");
    top.appendChild(arrow);

    // Nama produk
    const title = document.createElement("h3");
    title.textContent = link.name;

    // Kategori
    const category = document.createElement("div");
    category.className = "category";
    category.textContent = link.category;

    // Susunan elemen panel
    card.appendChild(image);
    card.appendChild(top);
    card.appendChild(title);
    card.appendChild(category);

    grid.appendChild(card);
  });

  count.textContent = results.length + " links";
  empty.style.display = results.length ? "none" : "block";
}
